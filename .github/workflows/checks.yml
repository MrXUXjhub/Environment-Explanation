name: Python syntax check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check seven standalone scripts
        run: python -m py_compile OLS.py RF.py CatBoost.py LightGBM.py XGBoost.py LSTM.py SHAP_PDP.py
